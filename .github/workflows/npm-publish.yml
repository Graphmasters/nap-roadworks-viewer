name: Publish to npm

# Runs when a GitHub release is published, or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check that the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$expected" ]; then
            echo "Release tag $TAG_NAME does not match package.json (expected $expected)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Publishes to the public npm registry with provenance. Authentication uses npm
      # trusted publishing, so no npm token is stored in the repository.
      - run: npm publish --provenance --access public --registry=https://registry.npmjs.org/
